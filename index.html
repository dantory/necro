<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>necro — 네크로멘서</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="hud.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="top">
    <span class="floor" id="hFloor">1층</span>
    <span class="left" id="hLeft"></span>
    <span class="sp"></span>
    <span class="who"><b id="hName">네크로멘서</b> <span id="hLv">Lv.1</span> · 금 <span id="hGold">0</span></span>
  </div>

  <!-- 로그 — 판 안이 아니라 전장 아래쪽에 반투명으로 겹친다(판 바로 위) -->
  <div id="log"></div>

  <!-- ══════════════════════════════════════════════════════
       아래 판 — **처음부터 다시.**
       ────────────────────────────────────────────────────
       아홉 번 고쳐 아홉 번 다 어긋났고, 뿌리는 하나였다:
       **좌표로 조립했다.** `left:118px; right:118px` 같은 값으로 자리를 잡으니
       화면 폭이 바뀔 때마다 어딘가가 넘치거나 파고들었다. 그 위에 테마 CSS 를
       아홉 겹 덧칠하며 숫자를 계속 고쳤지만, 고칠 곳이 늘어날 뿐이었다.

       그래서 **마크업부터 버리고 flex 한 줄로 다시 짠다** — 구슬 · 가운데 · 구슬.
       가운데가 남는 폭을 먹고, 구슬은 제 크기만 차지한다. 좌표 계산이 없으니
       어느 폭에서도 저절로 맞는다. (id 는 그대로 두어 js 를 안 건드린다.)
       ══════════════════════════════════════════════════════ -->
  <div id="panel">
    <!-- 구슬은 **캔버스에 픽셀로 직접 그린다**(js/orb.js). CSS 원은 안티에일리어싱이
         먹어 가장자리가 매끈해지는데, 그 매끈함 하나가 픽셀 화면에서 제일 튄다. -->
    <div class="orb hp"><canvas id="hpOrb" width="30" height="30"></canvas><div class="num" id="hpNum">100/100</div></div>

    <div class="mid">
      <div class="res"><span id="gCorpse">시체 0</span><span class="xpTxt" id="xpNum">Lv.1</span><span id="gArmy">군세 0/6</span></div>
      <div class="xp" id="xpWrap"><div class="xpFill" id="xpFill"></div><canvas class="fr"></canvas></div>
      <div id="belt"></div>
    </div>

    <div class="orb mp"><canvas id="mpOrb" width="30" height="30"></canvas><div class="num" id="mpNum">40/40</div></div>
  </div>

  <!-- 능력치 창 -->
  <div class="win" id="winStat"><div class="frame">
    <h2>능 력 치</h2>
    <div id="statBody"></div>
  </div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
