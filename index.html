<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>necro — 네크로멘서</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="hud.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="top">
    <span class="floor" id="hFloor">1층</span>
    <span class="left" id="hLeft"></span>
    <span class="sp"></span>
    <!-- ★★ 눌러야 열리는 둘은 **단추로 보이고, 무엇을 여는지 말해야 한다.**
         예전엔 「네크로멘서」와 「Lv.14」라는 **그냥 글자**였고, 병수님이
         "상태창이나 스킬/인벤토리 등은 어떻게 열어" 라고 물으셨다 —
         입구가 있어도 눌러야 하는 줄 알 길이 없으면 없는 것과 같다.
         ① 벨트 칸과 같은 돌·금테를 씌워 **단추로** 보이게 하고
         ② 글자를 이름이 아니라 **하는 일**로 바꾼다(능력치 · 스킬).
         작은 그림도 붙여 봤는데 13px 어두운 판 위에서 안 보여 뺐다 —
         안 보이는 장식은 없는 것만 못하다.
         (인벤토리는 따로 없다. 능력치 창 안에 낀 것 3칸 + 가방 12칸으로 들어 있다.) -->
    <span class="who"><button id="hName" class="hBtn" title="능력치 · 장비 · 가방">능력치</button>
      <button id="hLv" class="hBtn lvBtn" title="스킬 트리">스킬 <span id="hLvT">Lv.1</span><i id="spDot"></i></button>
      · 금 <span id="hGold">0</span></span>
  </div>

  <!-- 로그 — 판 안이 아니라 전장 아래쪽에 반투명으로 겹친다(판 바로 위) -->
  <div id="log"></div>

  <!-- ══════════════════════════════════════════════════════
       아래 판 — **처음부터 다시.**
       ────────────────────────────────────────────────────
       아홉 번 고쳐 아홉 번 다 어긋났고, 뿌리는 하나였다:
       **좌표로 조립했다.** `left:118px; right:118px` 같은 값으로 자리를 잡으니
       화면 폭이 바뀔 때마다 어딘가가 넘치거나 파고들었다. 그 위에 테마 CSS 를
       아홉 겹 덧칠하며 숫자를 계속 고쳤지만, 고칠 곳이 늘어날 뿐이었다.

       그래서 **마크업부터 버리고 flex 한 줄로 다시 짠다** — 구슬 · 가운데 · 구슬.
       가운데가 남는 폭을 먹고, 구슬은 제 크기만 차지한다. 좌표 계산이 없으니
       어느 폭에서도 저절로 맞는다. (id 는 그대로 두어 js 를 안 건드린다.)
       ══════════════════════════════════════════════════════ -->
  <div id="panel">
    <!-- 구슬·띠·칸을 **하나의 실루엣으로 잇는** 판(js/hudplate.js).
         네모난 배경이 아니라 뼈대다 — 그래야 한 묶음으로 보인다. -->
    <canvas id="hudPlate"></canvas>
    <!-- 구슬은 **캔버스에 픽셀로 직접 그린다**(js/orb.js). CSS 원은 안티에일리어싱이
         먹어 가장자리가 매끈해지는데, 그 매끈함 하나가 픽셀 화면에서 제일 튄다. -->
    <div class="orb hp"><canvas id="hpOrb" width="64" height="64"></canvas><div class="num" id="hpNum"><b>100</b><i>/100</i></div></div>

    <div class="mid">
      <div class="res"><span id="gCorpse">시체 0</span><span class="xpTxt" id="xpNum">Lv.1</span><span id="gArmy">군세 0/6</span></div>
      <div class="xp" id="xpWrap"><div class="xpFill" id="xpFill"></div><canvas class="fr"></canvas></div>
      <div id="belt"></div>
    </div>

    <div class="orb mp"><canvas id="mpOrb" width="64" height="64"></canvas><div class="num" id="mpNum"><b>40</b><i>/40</i></div></div>
  </div>

  <!-- 능력치 창 — 상인·대장간과 **같은 돌**(wSub·tip·winFoot). 낀 것·가방·합친 수치. -->
  <div class="win" id="winStat"><div class="frame">
    <h2>능 력 치</h2>
    <div class="wSub">「낀 것과 주운 것. 고르면 뜯어본다.」</div>
    <div id="statBody"></div>
    <div class="tip" id="statTip"></div>
    <div class="winFoot"><span class="purse">가진 금 <b id="statGold">0</b></span>
      <button class="btn" data-close>나가기</button></div>
  </div></div>

  <!-- 정산 — 판이 끝나면 「이번 판에 얻은 것」. 상인·상태창과 **같은 돌**(.grid·.cell·.tip·winFoot). -->
  <div class="win" id="winEnd"><div class="frame">
    <h2>정 산</h2>
    <div class="wSub" id="endSub"></div>
    <div id="endBody"></div>
    <div class="winFoot"><span class="purse">가진 금 <b id="endGold">0</b></span>
      <button class="btn" data-close>마을로</button></div>
  </div></div>

  <!-- 상인 — **장비를 산다.** 등급을 사는 것이라 한 번 사면 다음 등급이 열린다 -->
  <div class="win" id="winShop"><div class="frame">
    <h2>상 인</h2>
    <div class="wSub">「쓸 만한 건 다 있소. 값만 치르면.」</div>
    <div class="grid" id="shopGrid"></div>
    <div class="tip" id="shopTip"></div>
    <div class="winFoot"><span class="purse">가진 금 <b id="shopGold">0</b></span>
      <button class="btn" data-close>나가기</button></div>
  </div></div>

  <!-- 대장간 — **몸을 키운다.** 장비와 축이 다르다 -->
  <div class="win" id="winForge"><div class="frame">
    <h2>대 장 간</h2>
    <div class="wSub">「뼈는 못 고쳐도, 몸은 두드려 주지.」</div>
    <div class="grid" id="forgeGrid"></div>
    <div class="tip" id="forgeTip"></div>
    <div class="winFoot"><span class="purse">가진 금 <b id="forgeGold">0</b></span>
      <button class="btn" data-close>나가기</button></div>
  </div></div>

  <!-- 스킬 트리 — **레벨로 사는 것.** 금으로 사는 둘(상인·대장간)과 축이 다르고,
       되돌릴 수 없어서 「나만의 빌드」가 된다 -->
  <div class="win" id="winTree"><div class="frame wide">
    <h2>어 둠 의 길</h2>
    <div class="wSub">「점수는 모자란다. 그러니 고르는 것이다.」</div>
    <!-- 줄기만 구른다. 아래 끝의 흐림(#treeWrap::after)이 「더 있다」를 말한다 -->
    <div id="treeWrap"><div id="treeCols"></div></div>
    <div class="tip" id="treeTip"></div>
    <div class="winFoot"><span class="purse">남은 점수 <b id="treeSp">0</b>
      <span class="dim" id="treeSpAll">0/0</span></span>
      <button class="btn" data-close>나가기</button></div>
  </div></div>

  <!-- 로딩 — **에셋이 다 올 때까지 화면을 덮는다.** 반쯤 그려진 판을 보여 주면
       「깨진 것」으로 읽힌다. 다 오면 스스로 물러난다. -->
  <div id="loading">
    <div class="lWrap">
      <div class="lTitle">네크로멘서</div>
      <div class="lBar"><div class="lFill" id="lFill"></div></div>
      <div class="lTxt" id="lTxt">뼈를 맞추는 중…</div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
