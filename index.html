<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>necro — 네크로멘서</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="top">
    <span class="floor" id="hFloor">1층</span>
    <span class="left" id="hLeft"></span>
    <span class="sp"></span>
    <span class="who"><b id="hName">네크로멘서</b> <span id="hLv">Lv.1</span> · 금 <span id="hGold">0</span></span>
  </div>

  <!-- 로그 — 판 안이 아니라 전장 아래쪽에 반투명으로 겹친다(판 바로 위) -->
  <div id="log"></div>

  <!-- ══ 아래 판 — 붉은 구슬 · 스킬 벨트 · 푸른 구슬 ══ -->
  <div id="panel">
    <!-- 유리알(.glass)만 원으로 잘라내고, 금장 테(.ring)와 숫자는 **그 바깥**에 둔다.
         테를 .orb 안에 넣었더니 overflow:hidden 이 테까지 구슬 원으로 잘라내,
         그림의 가운데 구멍(42.6%)만 남아 숫자를 덮었다. -->
    <div class="orb hp">
      <div class="glass"><div class="fill" id="hpFill" style="height:100%"></div>
        <div class="gloss"></div></div>
      <div class="ring"></div><div class="num" id="hpNum">100 / 100</div></div>

    <!-- 벨트 아래가 통째로 비어 있었다(병수님: "UI 하단 여백있음?").
         D2 도 벨트 밑에 경험치 띠가 있다 — 빈자리를 지우는 게 아니라 **제 것으로 채운다**.
         시체·군세는 흘러가는 로그가 아니라 **늘 봐야 하는 값**이라 여기가 제집이다. -->
    <div id="beltArc"><div id="belt"></div></div>
    <div id="gauge">
      <div class="res"><span id="gCorpse">시체 0</span><span id="gArmy">군세 0/6</span></div>
      <div class="xp"><div class="xpFill" id="xpFill"></div><span id="xpNum">Lv.1</span></div>
    </div>

    <div class="orb mp">
      <div class="glass"><div class="fill" id="mpFill" style="height:100%"></div>
        <div class="gloss"></div></div>
      <div class="ring"></div><div class="num" id="mpNum">40 / 40</div></div>
  </div>

  <!-- 능력치 창 -->
  <div class="win" id="winStat"><div class="frame">
    <h2>능 력 치</h2>
    <div id="statBody"></div>
  </div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
